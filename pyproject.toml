[project]
name = "utr-recruited-at"
version = "0.1.0"
description = "Compare a recruit's UTR against what a conference's roster players were recruited at."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13"]

[project.optional-dependencies]
scraper = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
utr-recruited-at = "utr_recruited_at.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utr_recruited_at*"]

[tool.pytest.ini_options]
markers = ["live: hits the real UTR API (needs UTR_SESSION_COOKIE)"]
